name: Validate JobPilot

on:
  push:
    branches:
      - main
      - feature/gemini-job-analysis
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate PowerShell regression script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/services/api/scripts/Invoke-RegressionTests.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run backend unit tests
        run: dotnet test services/api.tests/JobPilot.Api.Tests.csproj --configuration Release


  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build dashboard
        run: npm run build

  extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dbot-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.json', 'utf8'))"
      - name: Validate service worker syntax
        run: node --check public/service-worker.js
      - name: Type check
        run: npm run typecheck
      - name: Build extension
        run: npm run build
