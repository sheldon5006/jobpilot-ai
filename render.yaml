# Render Blueprint for a €0/month personal JobPilot deployment.
# Free web services sleep after ~15 minutes idle and take up to a minute to wake.
# Secrets marked `sync: false` are entered in the Render dashboard; never commit them.
services:
  - type: web
    name: jobpilot-api
    runtime: docker
    plan: free
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: Auth__GoogleClientId # OAuth client ID from Google Cloud Console
        sync: false
      - key: Auth__AllowedEmails # Your Google address(es), comma separated
        sync: false
      - key: Auth__SigningKey
        generateValue: true
      - key: DASHBOARD_ORIGIN # e.g. https://jobpilot-dashboard.onrender.com
        sync: false

  - type: web
    name: jobpilot-dashboard
    runtime: static
    rootDir: apps/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL # e.g. https://jobpilot-api.onrender.com
        sync: false
